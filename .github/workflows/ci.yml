name: CI and release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PACKAGE: hd-server

jobs:
  # Tests read the game data tables in resources/, which are never committed
  # (see LEGAL.md). The job runs on a self-hosted runner that holds a Hay Day
  # 1.43.150 x86 APK (path in the runner's HD_APK variable) and generates the
  # tables from it with hd-dumper on every run.
  test:
    name: Run tests
    runs-on: [self-hosted, linux]
    # Self-hosted runners must not run code from fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: hd-server

      - name: Checkout hd-dumper
        uses: actions/checkout@v4
        with:
          repository: eliaswen/hd-dumper
          path: hd-dumper

      - name: Generate resources
        working-directory: hd-dumper
        run: |
          test -f "${HD_APK:?set HD_APK on the runner}"
          cargo run --release --locked -- --apk "$HD_APK" --out ../hd-server/resources --require-complete

      - name: Run tests
        working-directory: hd-server
        run: cargo test --locked

  release_metadata:
    name: Detect release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_release: ${{ steps.release_commit.outputs.is_release }}
      version: ${{ steps.release_commit.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect release commit
        id: release_commit
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          echo "is_release=false" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$subject" =~ ^Release\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            manifest_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            if [[ "$manifest_version" != "$version" ]]; then
              echo "::error file=Cargo.toml::Commit says Release ${version} but Cargo.toml has version ${manifest_version}"
              exit 1
            fi

            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [release_metadata]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # No Windows build: the server uses Unix-only file APIs.
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            packages: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            packages: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Command-line builds for Android (Termux, adb shell). Apps link the
          # library instead.
          - target: aarch64-linux-android
            os: ubuntu-latest
            archive: tar.gz
            android_abi: arm64-v8a
          - target: x86_64-linux-android
            os: ubuntu-latest
            archive: tar.gz
            android_abi: x86_64
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --silent --show-error --fail \
              https://sh.rustup.rs --output /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-ndk
        if: matrix.android_abi
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build
        env:
          ANDROID_ABI: ${{ matrix.android_abi }}
        run: |
          if [[ -n "$ANDROID_ABI" ]]; then
            # The hosted runners ship an NDK; API 24 is Android 7.0.
            export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
            cargo ndk -t "$ANDROID_ABI" -P 24 build --release --locked
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          VERSION: ${{ needs.release_metadata.outputs.version }}
        run: |
          name="${PACKAGE}-${VERSION:-dev}-${TARGET}"
          exe=""
          [[ "$TARGET" == *windows* ]] && exe=".exe"

          mkdir -p "dist/$name"
          cp "target/$TARGET/release/${PACKAGE}${exe}" README.md LICENSE LEGAL.md config.toml.example "dist/$name/"

          cd dist
          if [[ "$ARCHIVE" == "zip" ]]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      - name: Install packaging tools
        if: matrix.packages
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      # Metadata lives in Cargo.toml under [package.metadata.deb] and
      # [package.metadata.generate-rpm].
      - name: Build deb and rpm
        if: matrix.packages
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo deb --no-build --locked --target "$TARGET" --output dist/
          cargo generate-rpm --target "$TARGET" --output dist/

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.${{ matrix.archive }}
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: [release_metadata, test, build]
    if: success() && needs.release_metadata.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A key dedicated to package signing, not a personal one.
      - name: Import signing key
        uses: ./.github/actions/import-signing-key
        with:
          key: ${{ secrets.PACKAGE_SIGNING_KEY }}

      - name: Sign RPMs
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          # Ubuntu's rpm macros expect gpg2; point them at the gpg on PATH.
          rpmsign --define "__gpg $(command -v gpg)" --define "_gpg_name $SIGNING_KEY_ID" \
            --addsign dist/*.rpm

      - name: Compute checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Generate linked release notes
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          previous_tag="$(
            git tag --merged HEAD^ --sort=-version:refname \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n 1 || true
          )"

          if [[ -n "$previous_tag" ]]; then
            range="${previous_tag}..HEAD"
            heading="## Commits since ${previous_tag}"
          else
            range="HEAD"
            heading="## Commits"
          fi

          echo "$heading" > release-notes.md
          echo >> release-notes.md
          while IFS=$'\t' read -r sha subject; do
            short_sha="${sha:0:7}"
            printf -- '- [`%s`](%s/%s/commit/%s) %s\n' \
              "$short_sha" "$SERVER_URL" "$REPOSITORY" "$sha" "$subject"
          done < <(git log --reverse --pretty=tformat:'%H%x09%s' "$range") \
            >> release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release_metadata.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; nothing to do."
            exit 0
          fi

          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Release $VERSION" \
            --notes-file release-notes.md \
            --latest \
            dist/*

  # Rebuilds the whole apt and dnf repository from the .deb and .rpm assets of
  # every release, so the Pages site keeps no state of its own. Run the
  # workflow manually to republish it.
  pages:
    name: Publish package repository
    needs: [release]
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      REPO_NAME: ${{ github.event.repository.name }}
    defaults:
      run:
        shell: bash

    steps:
      # For the local import-signing-key action.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c

      # A key dedicated to package signing, not a personal one.
      - name: Import signing key
        uses: ./.github/actions/import-signing-key
        with:
          key: ${{ secrets.PACKAGE_SIGNING_KEY }}

      - name: Download packages from every release
        run: |
          mkdir -p downloads site/deb site/rpm
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while read -r tag; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qE '\.(deb|rpm)$'; then
              gh release download "$tag" --dir downloads --pattern '*.deb' --pattern '*.rpm'
            fi
          done
          shopt -s nullglob
          debs=(downloads/*.deb)
          rpms=(downloads/*.rpm)
          (( ${#debs[@]} )) && mv "${debs[@]}" site/deb/
          (( ${#rpms[@]} )) && mv "${rpms[@]}" site/rpm/
          ls -l site/deb site/rpm

      # A flat repository: `deb <url>/deb ./`.
      - name: Build apt repository
        working-directory: site/deb
        run: |
          apt-ftparchive packages . > Packages
          gzip -9k Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="$REPO_NAME" \
            -o APT::FTPArchive::Release::Label="$REPO_NAME" \
            release . > "$RUNNER_TEMP/Release"
          mv "$RUNNER_TEMP/Release" Release
          gpg --batch --yes --local-user "$SIGNING_KEY_ID" --clearsign --output InRelease Release
          gpg --batch --yes --local-user "$SIGNING_KEY_ID" --armor --detach-sign --output Release.gpg Release

      - name: Build dnf repository
        run: |
          createrepo_c site/rpm
          gpg --batch --yes --local-user "$SIGNING_KEY_ID" --armor --detach-sign site/rpm/repodata/repomd.xml

      - name: Write key, repo file and index
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          gpg --export "$SIGNING_KEY_ID" > site/key.gpg
          gpg --armor --export "$SIGNING_KEY_ID" > site/key.asc

          cat > "site/${REPO_NAME}.repo" <<EOF
          [${REPO_NAME}]
          name=${REPO_NAME}
          baseurl=${BASE_URL}/rpm
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=${BASE_URL}/key.asc
          EOF

          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>${REPO_NAME} packages</title>
          <style>
          :root { color-scheme: light dark; }
          body { font: 16px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
          pre { background: color-mix(in srgb, currentColor 8%, transparent); padding: .75rem 1rem; border-radius: 6px; overflow-x: auto; }
          </style>
          </head>
          <body>
          <h1>${REPO_NAME} packages</h1>
          <p>Signed apt and dnf repositories for <a href="${REPO_URL}">${REPO_NAME}</a>, for x86_64 and arm64.
          Binaries for other platforms are on the <a href="${REPO_URL}/releases">releases page</a>.</p>
          <p>Signing key: <a href="key.asc">key.asc</a> (fingerprint <code>${SIGNING_KEY_ID}</code>).</p>
          <h2>Debian and Ubuntu</h2>
          <pre>sudo curl -fsSLo /usr/share/keyrings/${REPO_NAME}.gpg ${BASE_URL}/key.gpg
          echo "deb [signed-by=/usr/share/keyrings/${REPO_NAME}.gpg] ${BASE_URL}/deb ./" | sudo tee /etc/apt/sources.list.d/${REPO_NAME}.list
          sudo apt update
          sudo apt install ${REPO_NAME}</pre>
          <h2>Fedora, RHEL and openSUSE</h2>
          <pre>sudo curl -fsSLo /etc/yum.repos.d/${REPO_NAME}.repo ${BASE_URL}/${REPO_NAME}.repo
          sudo dnf install ${REPO_NAME}</pre>
          <p>On openSUSE, add the repository with <code>sudo zypper addrepo ${BASE_URL}/${REPO_NAME}.repo</code>
          and install with <code>sudo zypper install ${REPO_NAME}</code>.</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
